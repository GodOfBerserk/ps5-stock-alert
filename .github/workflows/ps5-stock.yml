name: PS5 stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub often runs it later than this)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Discord"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check stores and alert Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST: ${{ inputs.test }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"

          send() {
            jq -n --arg c "$1" '{content:$c, allowed_mentions:{parse:["everyone"]}}' \
              | curl -sS -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
          }

          if [ "$TEST" = "true" ]; then
            send "**PS5 cloud alert test**: the GitHub checker is connected (PlayStation Direct + Amazon)."
          fi

          # --- PlayStation Direct ---
          PS_PAGE="https://direct.playstation.com/en-us/buy-consoles/playstation5-digital-edition-console-825-gb"
          PS_API="https://api.direct.playstation.com/commercewebservices/ps-direct-us/users/anonymous/products/productList?fields=BASIC&productCodes=1000049898"
          PS=$(curl -sS --max-time 20 -A "$UA" \
            -H "Origin: https://direct.playstation.com" -H "Referer: https://direct.playstation.com/" \
            "$PS_API" | jq -r '.products[0].stock.stockLevelStatus // "unknown"' 2>/dev/null || echo error)
          echo "PlayStation Direct: $PS"
          if [ -n "$PS" ] && [ "$PS" != "outOfStock" ] && [ "$PS" != "unknown" ] && [ "$PS" != "error" ]; then
            send "@everyone **PS5 IN STOCK at PlayStation Direct!** (cloud check) Status: $PS. Go now: $PS_PAGE"
          fi

          # --- Amazon (only Amazon's own Add to Cart; ignores third-party sellers) ---
          AMZ_PAGE="https://www.amazon.com/dp/B0FRGMYJMG?th=1"
          HTML=$(curl -sS -L --compressed --max-time 20 -A "$UA" -H "Accept-Language: en-US,en;q=0.9" "$AMZ_PAGE" || true)
          if ! grep -q 'id="productTitle"' <<<"$HTML"; then
            AMZ=blocked
          elif grep -q 'id="add-to-cart-button"' <<<"$HTML" && ! grep -q 'Currently unavailable' <<<"$HTML"; then
            AMZ=inStock
          else
            AMZ=outOfStock
          fi
          echo "Amazon: $AMZ"
          if [ "$AMZ" = "inStock" ]; then
            send "@everyone **PS5 IN STOCK at Amazon!** (cloud check) Go now: $AMZ_PAGE"
          fi

          # --- Best Buy (sold & shipped by Best Buy, SKU 12472949) ---
          BB_PAGE="https://www.bestbuy.com/product/playstation-5-slim-digital-edition-console-825gb/JXHQ37TYYL/sku/12472949"
          BB_HTML=$(curl -sS -L --http2 --compressed --max-time 25 -A "$UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" \
            -H "Upgrade-Insecure-Requests: 1" \
            "$BB_PAGE" || true)
          echo "Best Buy debug: bytes=${#BB_HTML} SOLD_OUT=$(grep -o 'SOLD_OUT' <<<"$BB_HTML" | wc -l) ADD_TO_CART=$(grep -o 'ADD_TO_CART' <<<"$BB_HTML" | wc -l) SoldOutText=$(grep -o 'Sold Out' <<<"$BB_HTML" | wc -l) AddToCartText=$(grep -o 'Add to Cart' <<<"$BB_HTML" | wc -l)"
          if ! grep -q '12472949' <<<"$BB_HTML"; then
            BB=blocked
          elif grep -q 'SOLD_OUT\|Sold Out' <<<"$BB_HTML"; then
            BB=outOfStock
          elif grep -q 'ADD_TO_CART\|Add to Cart' <<<"$BB_HTML"; then
            BB=inStock
          else
            BB=unknown
          fi
          echo "Best Buy: $BB"
          if [ "$BB" = "inStock" ]; then
            send "@everyone **PS5 IN STOCK at Best Buy!** (cloud check) Go now: $BB_PAGE"
          fi
